<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <div class="wrapper">
      <h1>🌦️ Wetter</h1>
      <div class="currentWeather">
        <div class="temperature"><h2 id="temperature"></h2></div>
        <div class="status"><p id="status"></p></div>
      </div>
      <div class="dailyWeather">
        <div class="weatherTimeline">
          <p>Jetzt</p>
          <p>☁️</p>
          <p>8°</p>
        </div>
      </div>
      <div class="weekWeather">
        <p>7-Tage</p>
        <table>
          <tr>
            <td>Heute</td>
            <td>🌦️</td>
            <td>7°</td>
            <td>17°</td>
          </tr>
          <tr>
            <td>Heute</td>
            <td>🌦️</td>
            <td>7°</td>
            <td>17°</td>
          </tr>
          <tr>
            <td>Heute</td>
            <td>🌦️</td>
            <td>7°</td>
            <td>17°</td>
          </tr>
        </table>
      </div>
      <div></div>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
